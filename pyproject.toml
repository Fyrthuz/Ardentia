[project]
name = "ardintra"
version = "0.1.0"
description = "WildfireRisk-ES: Sistema de evaluación predictiva y explicable del riesgo de incendios forestales (piloto Galicia)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "geopandas>=1.0",
    "pyogrio>=0.10",
    "shapely>=2.0",
    "pyproj>=3.6",
    "h3>=4.1",
    "pyarrow>=17",
    "duckdb>=1.0",
    "rasterio>=1.3",
    "rioxarray>=0.17",
    "requests>=2.32",
    "httpx>=0.27",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "cdsapi>=0.7",
    "tenacity>=9.0",
    "tqdm>=4.66",
    "streamlit>=1.66.1",
    "streamlit-javascript>=0.1.5",
    "pydeck>=0.9.3",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ardintra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
